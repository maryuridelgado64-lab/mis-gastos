<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3D2E">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Mis Gastos</title>
<style>
:root{
  --bg:#F4F2EC; --card:#FFFFFF; --ink:#1B1A17; --muted:#77736A; --line:#E6E2D8;
  --brand:#1F3D2E; --brand2:#2F6B4F; --brandSoft:#E3EEE7;
  --out:#B9471F; --in:#2F7A4F; --warn:#C98A12;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* Header */
header.top{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 0 64px;border-radius:0 0 28px 28px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.app-title{font-weight:800;font-size:20px;letter-spacing:-.02em}
.sync{font-size:11px;font-weight:600;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:#9BD3B0;display:inline-block}
.sync.local i{background:#F2C14E}.sync.loading i{background:#ccc}
.month{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px}
.month button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;font-size:18px;display:grid;place-items:center}
.month .lbl{font-weight:700;font-size:16px;min-width:150px;text-align:center;text-transform:capitalize}

/* Summary */
.summary{background:var(--card);border-radius:var(--r);padding:18px;margin-top:-50px;box-shadow:0 8px 24px rgba(30,40,30,.08)}
.sum-k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sum-big{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:4px 0 12px}
.sum-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{background:var(--bg);border-radius:14px;padding:10px 12px}
.pill .v{font-weight:700;font-size:15px;margin-top:2px}
.v.out{color:var(--out)}.v.in{color:var(--in)}
.budget{margin-top:14px}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;background:var(--brand2);border-radius:99px;transition:width .4s}
.bar>span.warn{background:var(--warn)}.bar>span.over{background:var(--out)}
.budget-txt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}

/* Sections */
h2.sec{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:24px 4px 10px}
.day{margin-bottom:14px}
.day-h{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);padding:0 4px 6px;text-transform:capitalize}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item:active{background:#FAF8F3}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--muted);margin-top:2px}
.item .amt{font-weight:700;font-size:15px;white-space:nowrap}
.amt.out{color:var(--ink)}.amt.in{color:var(--in)}
.empty{text-align:center;color:var(--muted);padding:40px 20px;background:var(--card);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin:18px 0 0;outline:none}
.search:focus{border-color:var(--brand2)}

/* Resumen */
.card{background:var(--card);border-radius:var(--r);padding:16px}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{width:150px;height:150px;flex:none;position:relative}
.donut svg{transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .c b{display:block;font-size:17px;font-weight:800}
.donut .c small{font-size:11px;color:var(--muted);font-weight:600}
.legend{flex:1;min-width:0;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px;padding:3px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend em{font-style:normal;color:var(--muted);font-weight:600}
.catrow{padding:10px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .h{display:flex;align-items:center;gap:10px;font-size:14px}
.catrow .h .n{flex:1;font-weight:600}
.catrow .h .a{font-weight:700}
.catrow .bar{height:6px;margin-left:50px}
.months{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.mbars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.mbars span{width:42%;border-radius:5px 5px 2px 2px;min-height:2px}
.mcol small{font-size:11px;color:var(--muted);font-weight:600;text-transform:capitalize}
.mcol.cur small{color:var(--ink);font-weight:800}
.keyrow{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600;margin-top:10px}
.keyrow i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--card);border-radius:16px;padding:14px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:17px;font-weight:800;margin-top:4px}

/* Ajustes */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);outline:none;font-size:16px}
.inp:focus{border-color:var(--brand2);background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:700;background:var(--brand);color:#fff;width:100%}
.btn.sec{background:var(--brandSoft);color:var(--brand)}
.btn.danger{background:#FBE9E2;color:var(--out)}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.note ol{padding-left:18px;margin:8px 0 0}
.note li{margin-bottom:4px}
textarea.csv{width:100%;height:120px;font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);margin:10px 0}

/* Bottom nav + FAB */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
nav.bottom .wrap{display:flex;justify-content:space-around;align-items:center}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 14px;border-radius:12px}
.nb svg{width:22px;height:22px}
.nb.on{color:var(--brand)}
.fab{width:58px;height:58px;border-radius:20px;background:var(--brand2);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(47,107,79,.35);margin-top:-30px}
.fab svg{width:26px;height:26px}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(20,22,18,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:10px 0 calc(18px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{padding:10px;border-radius:11px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg button.on.g{color:var(--out)}.seg button.on.i{color:var(--in)}
.amount-in{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);padding:4px 2px 8px;margin-bottom:18px}
.amount-in:focus-within{border-color:var(--brand2)}
.amount-in span{font-size:28px;font-weight:700;color:var(--muted)}
.amount-in input{flex:1;border:0;outline:none;font-size:34px;font-weight:800;letter-spacing:-.02em;min-width:0;background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:600;border:1.5px solid transparent}
.chip.on{background:var(--brandSoft);border-color:var(--brand2);color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--out);font-size:13px;font-weight:600;min-height:18px;margin:-6px 0 8px}
.confirm{background:#FBE9E2;border-radius:14px;padding:12px;margin-top:10px;display:none}
.confirm.show{display:block}
.confirm p{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--out)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="toprow">
      <div class="app-title">Mis Gastos</div>
      <div id="sync" class="sync loading"><i></i><span>Conectando…</span></div>
    </div>
    <div class="month">
      <button id="prevM" aria-label="Mes anterior">‹</button>
      <div class="lbl" id="monthLbl"></div>
      <button id="nextM" aria-label="Mes siguiente">›</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="summary" id="summary"></section>

  <section id="v-home">
    <input class="search" id="q" type="search" placeholder="Buscar movimientos…" autocomplete="off">
    <div id="list"></div>
  </section>

  <section id="v-stats" class="hidden"></section>

  <section id="v-settings" class="hidden">
    <h2 class="sec">Presupuesto mensual de gastos</h2>
    <div class="card">
      <div class="field">
        <label for="budgetIn">¿Cuánto quieres gastar como máximo al mes?</label>
        <input class="inp" id="budgetIn" inputmode="numeric" placeholder="Ej: 2.000.000">
      </div>
      <button class="btn" id="saveBudget">Guardar presupuesto</button>
    </div>

    <h2 class="sec">Exportar</h2>
    <div class="card">
      <p class="note" style="margin:0">Copia tus movimientos del mes en formato CSV para pegarlos en Excel o Google Sheets.</p>
      <textarea class="csv" id="csv" readonly></textarea>
      <button class="btn sec" id="copyCsv">Copiar CSV</button>
    </div>

    <h2 class="sec">Dónde se guardan tus datos</h2>
    <div class="card note" id="storageNote"></div>
  </section>
</main>

<nav class="bottom">
  <div class="wrap">
    <button class="nb on" data-v="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Movimientos
    </button>
    <button class="fab" id="fab" aria-label="Agregar movimiento">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="nb" data-v="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Resumen
    </button>
    <button class="nb" data-v="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes
    </button>
  </div>
</nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="wrap">
    <div class="grab"></div>
    <div class="seg">
      <button data-t="gasto" class="g">Gasto</button>
      <button data-t="ingreso" class="i">Ingreso</button>
    </div>
    <div class="amount-in">
      <span>$</span>
      <input id="fAmt" inputmode="numeric" placeholder="0" autocomplete="off">
    </div>
    <div class="err" id="fErr"></div>
    <div class="field">
      <label>Categoría</label>
      <div class="chips" id="fCats"></div>
    </div>
    <div class="field">
      <label for="fDesc">Descripción</label>
      <input class="inp" id="fDesc" maxlength="80" placeholder="Ej: Mercado del mes">
    </div>
    <div class="row2">
      <div class="field">
        <label for="fDate">Fecha</label>
        <input class="inp" id="fDate" type="date">
      </div>
      <div class="field">
        <label for="fMethod">Medio de pago</label>
        <select class="inp" id="fMethod"></select>
      </div>
    </div>
    <button class="btn" id="fSave">Guardar</button>
    <div id="editActions" class="hidden" style="margin-top:10px">
      <button class="btn danger" id="fDel">Eliminar movimiento</button>
      <div class="confirm" id="confirmDel">
        <p>¿Seguro que quieres eliminarlo? No se puede deshacer.</p>
        <div class="row2">
          <button class="btn sec" id="noDel">Cancelar</button>
          <button class="btn" style="background:var(--out)" id="yesDel">Eliminar</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- Catálogos ---------- */
const CATS = {
  gasto: [
    {id:'alim', n:'Alimentación', e:'🛒', c:'#E07A5F'},
    {id:'rest', n:'Restaurantes', e:'🍽️', c:'#F2A541'},
    {id:'trans',n:'Transporte',   e:'🚌', c:'#3D7EAA'},
    {id:'viv',  n:'Vivienda',     e:'🏠', c:'#8A5A44'},
    {id:'serv', n:'Servicios',    e:'💡', c:'#5B8E7D'},
    {id:'salud',n:'Salud',        e:'💊', c:'#D64E6F'},
    {id:'edu',  n:'Educación',    e:'📚', c:'#6C63B5'},
    {id:'ent',  n:'Entretenimiento',e:'🎬',c:'#C06BC7'},
    {id:'comp', n:'Compras',      e:'🛍️', c:'#2A9D8F'},
    {id:'deuda',n:'Deudas',       e:'💳', c:'#7A7A7A'},
    {id:'otro', n:'Otros',        e:'📦', c:'#A39E93'}
  ],
  ingreso: [
    {id:'sal',  n:'Salario',      e:'💼', c:'#2F7A4F'},
    {id:'extra',n:'Ingreso extra',e:'✨', c:'#5AA469'},
    {id:'reg',  n:'Regalo',       e:'🎁', c:'#8CC084'},
    {id:'otroi',n:'Otros',        e:'💰', c:'#A3C9A8'}
  ]
};
const METHODS = [
  ['efectivo','Efectivo'],['debito','Tarjeta débito'],['credito','Tarjeta crédito'],
  ['nequi','Nequi / Daviplata'],['transf','Transferencia']
];
const catOf = (type,id) => (CATS[type]||CATS.gasto).find(c=>c.id===id) || {n:'Otros',e:'📦',c:'#A39E93'};
const methodName = id => (METHODS.find(m=>m[0]===id)||['',''])[1];

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const fmt = new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const money = n => fmt.format(Math.round(n||0)).replace(/\s/g,' ');
const num = new Intl.NumberFormat('es-CO');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const monthKey = (y,m) => y+'-'+pad(m+1);
const newId = () => 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const digits = s => String(s||'').replace(/\D/g,'');
function lsGet(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- Estado ---------- */
const now = new Date();
let cur = {y:now.getFullYear(), m:now.getMonth()};
let view = 'home';
let mode = 'loading';           // 'loading' | 'db' | 'local'
let txs = lsGet('gastos_cache', null) || lsGet('gastos_local', []);
let settings = lsGet('gastos_settings', {budget:0});
let col = null;                 // colección en la nube
let form = {type:'gasto', cat:'alim', editingId:null};

/* ---------- Persistencia ---------- */
async function saveTx(tx){
  if(mode==='db'){
    await col.doc(tx.id).set(tx);
  } else {
    const i = txs.findIndex(t=>t.id===tx.id);
    if(i>=0) txs[i]=tx; else txs.push(tx);
    lsSet('gastos_local', txs);
    render();
  }
}
async function deleteTx(id){
  if(mode==='db'){ await col.doc(id).delete(); }
  else { txs = txs.filter(t=>t.id!==id); lsSet('gastos_local', txs); render(); }
}
async function saveSettings(s){
  settings = Object.assign({}, settings, s);
  lsSet('gastos_settings', settings);
  if(mode==='db') await col.doc('settings').set(Object.assign({kind:'settings'}, settings));
  render();
}

/* ---------- Conexión a la nube (cuenta Claude) ---------- */
function setSync(){
  const el=$('#sync');
  el.className='sync '+(mode==='db'?'':mode);
  el.querySelector('span').textContent = mode==='db'?'Sincronizado':mode==='local'?'Guardado en tu celular':'Conectando…';
  const n=$('#storageNote');
  if(n) n.innerHTML = mode==='db'
    ? 'Tus movimientos se guardan de forma privada en tu cuenta de Claude: nadie más puede verlos y los ves igual en tu celular y en tu computador al abrir este mismo enlace con tu sesión iniciada.'
    : 'Tus movimientos se guardan solo en este celular, dentro de la app, y funcionan sin internet. Si borras los datos de la app o la desinstalas, se pierden: copia el CSV de vez en cuando como respaldo.';
}
function goLocal(){
  if(mode==='db') return;
  mode='local';
  txs = lsGet('gastos_local', txs||[]);
  setSync(); render();
}

async function connect(){
  const timer = setTimeout(goLocal, 10000);
  try{
    const C = window.claude;
    if(!C || typeof C.use!=='function'){ clearTimeout(timer); goLocal(); return; }
    const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
    const uid = user ? await user.id() : null;
    if(!db || !uid){ clearTimeout(timer); goLocal(); return; }
    col = db.collection('data/users/'+uid);
    let migrated = false;
    col.where('kind','==','tx').onSnapshot(async snap=>{
      if(!snap.metadata.fromCache) clearTimeout(timer);
      mode='db'; setSync();
      txs = snap.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
      lsSet('gastos_cache', txs);
      render();
      // Sube los movimientos que se hayan guardado sin conexión
      if(!migrated && !snap.metadata.fromCache){
        migrated = true;
        const local = lsGet('gastos_local', []);
        const ids = new Set(txs.map(t=>t.id));
        const pend = local.filter(t=>!ids.has(t.id));
        try{
          for(const t of pend){ await col.doc(t.id).set(Object.assign({}, t, {kind:'tx'})); }
          lsDel('gastos_local');
          if(pend.length) toast(pend.length+' movimiento(s) sincronizado(s)');
        }catch(e){}
      }
    }, err=>{ clearTimeout(timer); goLocal(); });
    col.doc('settings').onSnapshot(s=>{
      if(s.exists){ const d=s.data(); settings={budget:Number(d.budget)||0}; lsSet('gastos_settings',settings); render(); }
    }, ()=>{});
  }catch(e){ clearTimeout(timer); goLocal(); }
}

/* ---------- Cálculos ---------- */
const inMonth = (y,m) => txs.filter(t=>t.date && t.date.startsWith(monthKey(y,m)));
function totals(list){
  let g=0,i=0; for(const t of list){ if(t.type==='ingreso') i+=t.amount; else g+=t.amount; }
  return {g,i,b:i-g};
}
function shift(y,m,d){ const x=new Date(y,m+d,1); return {y:x.getFullYear(), m:x.getMonth()}; }

/* ---------- Render ---------- */
function render(){
  const lbl = new Date(cur.y,cur.m,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  $('#monthLbl').textContent = lbl;
  const list = inMonth(cur.y,cur.m);
  renderSummary(list);
  if(view==='home') renderList(list);
  if(view==='stats') renderStats(list);
  if(view==='settings') renderSettings(list);
}

function renderSummary(list){
  const t = totals(list);
  const B = settings.budget||0;
  let budgetHtml = '';
  if(B>0){
    const p = Math.min(100, t.g/B*100);
    const cls = t.g>B?'over':p>=80?'warn':'';
    const left = B-t.g;
    budgetHtml = `<div class="budget">
      <div class="budget-txt"><span>Presupuesto ${money(B)}</span><span>${left>=0?'Te quedan '+money(left):'Excedido por '+money(-left)}</span></div>
      <div class="bar"><span class="${cls}" style="width:${p}%"></span></div></div>`;
  } else {
    budgetHtml = `<div class="budget budget-txt"><span>Sin presupuesto definido</span><button style="color:var(--brand2);font-weight:700;font-size:12px" data-go="settings">Definir →</button></div>`;
  }
  $('#summary').innerHTML = `
    <div class="sum-k">Balance del mes</div>
    <div class="sum-big" style="color:${t.b<0?'var(--out)':'var(--ink)'}">${money(t.b)}</div>
    <div class="sum-row">
      <div class="pill"><div class="sum-k">Gastos</div><div class="v out">${money(t.g)}</div></div>
      <div class="pill"><div class="sum-k">Ingresos</div><div class="v in">${money(t.i)}</div></div>
    </div>${budgetHtml}`;
}

function dayLabel(ds){
  const t=todayStr();
  const y=new Date(); y.setDate(y.getDate()-1);
  const ys=y.getFullYear()+'-'+pad(y.getMonth()+1)+'-'+pad(y.getDate());
  if(ds===t) return 'Hoy';
  if(ds===ys) return 'Ayer';
  const [a,b,c]=ds.split('-').map(Number);
  return new Date(a,b-1,c).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'short'});
}

function renderList(list){
  const q = ($('#q').value||'').trim().toLowerCase();
  let items = list.slice();
  if(q) items = items.filter(t=>{
    const c=catOf(t.type,t.cat);
    return (t.desc||'').toLowerCase().includes(q) || c.n.toLowerCase().includes(q) || methodName(t.method).toLowerCase().includes(q);
  });
  items.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.created||0)-(a.created||0));
  const el=$('#list');
  if(!items.length){
    el.innerHTML = `<h2 class="sec">Movimientos</h2><div class="empty"><b>${q?'Sin resultados':'Aún no hay movimientos este mes'}</b>${q?'Prueba con otra palabra.':'Toca el botón <b>+</b> para registrar tu primer gasto o ingreso.'}</div>`;
    return;
  }
  const groups = {};
  for(const t of items){ (groups[t.date]=groups[t.date]||[]).push(t); }
  let html = `<h2 class="sec">Movimientos (${items.length})</h2>`;
  for(const d of Object.keys(groups)){
    const g = groups[d];
    const dayOut = g.filter(t=>t.type!=='ingreso').reduce((s,t)=>s+t.amount,0);
    html += `<div class="day"><div class="day-h"><span>${esc(dayLabel(d))}</span><span>${dayOut?'−'+money(dayOut):''}</span></div><div class="list">`;
    for(const t of g){
      const c=catOf(t.type,t.cat); const inc=t.type==='ingreso';
      html += `<button class="item" data-id="${esc(t.id)}">
        <div class="ico" style="background:${c.c}22">${c.e}</div>
        <div class="mid"><div class="t">${esc(t.desc||c.n)}</div><div class="s">${esc(c.n)}${t.method?' · '+esc(methodName(t.method)):''}</div></div>
        <div class="amt ${inc?'in':'out'}">${inc?'+':'−'}${money(t.amount)}</div></button>`;
    }
    html += `</div></div>`;
  }
  el.innerHTML = html;
}

function renderStats(list){
  const gastos = list.filter(t=>t.type!=='ingreso');
  const total = gastos.reduce((s,t)=>s+t.amount,0);
  const byCat = {};
  for(const t of gastos){ byCat[t.cat]=(byCat[t.cat]||0)+t.amount; }
  const rows = Object.entries(byCat).map(([id,v])=>({c:catOf('gasto',id),v})).sort((a,b)=>b.v-a.v);

  // Donut
  let off=0, segs='';
  for(const r of rows){
    const p=r.v/total*100;
    segs += `<circle r="15.915" cx="18" cy="18" fill="none" stroke="${r.c.c}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-off}"></circle>`;
    off+=p;
  }
  const donut = total>0 ? `
    <div class="donut-wrap">
      <div class="donut"><svg viewBox="0 0 36 36" width="150" height="150"><circle r="15.915" cx="18" cy="18" fill="none" stroke="var(--line)" stroke-width="5"></circle>${segs}</svg>
        <div class="c"><div><b>${money(total)}</b><small>gastado</small></div></div></div>
      <div class="legend">${rows.slice(0,6).map(r=>`<div><i style="background:${r.c.c}"></i><span>${esc(r.c.n)}</span><em>${Math.round(r.v/total*100)}%</em></div>`).join('')}</div>
    </div>` : `<div class="empty" style="padding:24px"><b>Sin gastos este mes</b>Cuando registres gastos verás aquí en qué se va tu dinero.</div>`;

  const catList = rows.map(r=>`
    <div class="catrow"><div class="h"><div class="ico" style="background:${r.c.c}22;width:40px;height:40px">${r.c.e}</div><span class="n">${esc(r.c.n)}</span><span class="a">${money(r.v)}</span></div>
    <div class="bar"><span style="width:${r.v/rows[0].v*100}%;background:${r.c.c}"></span></div></div>`).join('');

  // Últimos 6 meses
  const months=[]; for(let k=5;k>=0;k--){ const s=shift(cur.y,cur.m,-k); months.push(Object.assign(s, totals(inMonth(s.y,s.m)))); }
  const max = Math.max(1,...months.map(x=>Math.max(x.g,x.i)));
  const bars = months.map((x,ix)=>`
    <div class="mcol ${ix===5?'cur':''}"><div class="mbars">
      <span style="height:${x.i/max*100}%;background:var(--in)"></span>
      <span style="height:${x.g/max*100}%;background:var(--out)"></span></div>
      <small>${new Date(x.y,x.m,1).toLocaleDateString('es-CO',{month:'short'}).replace('.','')}</small></div>`).join('');

  // Indicadores
  const prev = shift(cur.y,cur.m,-1);
  const prevG = totals(inMonth(prev.y,prev.m)).g;
  const isCur = cur.y===now.getFullYear() && cur.m===now.getMonth();
  const daysIn = new Date(cur.y,cur.m+1,0).getDate();
  const daysUsed = isCur ? now.getDate() : daysIn;
  const avg = total/daysUsed;
  const big = gastos.slice().sort((a,b)=>b.amount-a.amount)[0];
  let diff = '—';
  if(prevG>0){ const d=(total-prevG)/prevG*100; diff = (d>0?'+':'')+Math.round(d)+'%'; }

  $('#v-stats').innerHTML = `
    <h2 class="sec">¿En qué gasto?</h2>
    <div class="card">${donut}</div>
    <div class="stat-grid">
      <div class="stat"><div class="k">Promedio diario</div><div class="v">${money(avg)}</div></div>
      <div class="stat"><div class="k">vs. mes anterior</div><div class="v" style="color:${prevG>0&&total>prevG?'var(--out)':'var(--in)'}">${diff}</div></div>
      ${isCur?`<div class="stat"><div class="k">Proyección del mes</div><div class="v">${money(avg*daysIn)}</div></div>`:''}
      <div class="stat"><div class="k">Gasto más alto</div><div class="v" style="font-size:15px">${big?money(big.amount):'—'}</div>${big?`<div class="k" style="margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(big.desc||catOf('gasto',big.cat).n)}</div>`:''}</div>
    </div>
    ${rows.length?`<h2 class="sec">Por categoría</h2><div class="card" style="padding:6px 16px">${catList}</div>`:''}
    <h2 class="sec">Últimos 6 meses</h2>
    <div class="card"><div class="months">${bars}</div>
      <div class="keyrow"><span><i style="background:var(--in)"></i>Ingresos</span><span><i style="background:var(--out)"></i>Gastos</span></div></div>`;
}

function renderSettings(list){
  const b=$('#budgetIn');
  if(document.activeElement!==b) b.value = settings.budget? num.format(settings.budget):'';
  const rows = list.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const q = s => '"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  $('#csv').value = ['Fecha,Tipo,Categoría,Descripción,Medio de pago,Monto']
    .concat(rows.map(t=>[t.date, t.type==='ingreso'?'Ingreso':'Gasto', catOf(t.type,t.cat).n, t.desc||'', methodName(t.method), (t.type==='ingreso'?1:-1)*t.amount].map(q).join(',')))
    .join('\n');
  setSync();
}

/* ---------- Formulario ---------- */
function openSheet(tx){
  form.editingId = tx?tx.id:null;
  form.type = tx?tx.type:'gasto';
  form.cat = tx?tx.cat:(form.type==='gasto'?'alim':'sal');
  $('#fAmt').value = tx? num.format(tx.amount):'';
  $('#fDesc').value = tx? (tx.desc||''):'';
  const defDate = (cur.y===now.getFullYear()&&cur.m===now.getMonth()) ? todayStr() : monthKey(cur.y,cur.m)+'-01';
  $('#fDate').value = tx? tx.date : defDate;
  $('#fMethod').value = tx? (tx.method||'efectivo') : (lsGet('gastos_lastMethod','efectivo'));
  $('#fErr').textContent='';
  $('#fSave').textContent = tx?'Guardar cambios':'Guardar';
  $('#editActions').classList.toggle('hidden', !tx);
  $('#confirmDel').classList.remove('show');
  paintForm();
  $('#overlay').classList.add('open'); $('#sheet').classList.add('open');
  if(!tx) setTimeout(()=>$('#fAmt').focus(), 250);
}
function closeSheet(){ $('#overlay').classList.remove('open'); $('#sheet').classList.remove('open'); document.activeElement && document.activeElement.blur(); }
function paintForm(){
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', b.dataset.t===form.type));
  $('#fCats').innerHTML = CATS[form.type].map(c=>`<button class="chip ${c.id===form.cat?'on':''}" data-c="${c.id}">${c.e} ${esc(c.n)}</button>`).join('');
  $('#fSave').style.background = form.type==='ingreso'?'var(--in)':'var(--brand)';
}

$('#fMethod').innerHTML = METHODS.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('');

document.querySelector('.seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(form.type!==b.dataset.t){ form.type=b.dataset.t; form.cat=CATS[form.type][0].id; paintForm(); }
});
$('#fCats').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; form.cat=b.dataset.c; paintForm(); });
function moneyInput(el){
  el.addEventListener('input',()=>{ const d=digits(el.value).slice(0,12); el.value = d? num.format(Number(d)):''; });
}
moneyInput($('#fAmt')); moneyInput($('#budgetIn'));

$('#fSave').addEventListener('click', async ()=>{
  const amount = Number(digits($('#fAmt').value));
  if(!amount){ $('#fErr').textContent='Escribe un monto mayor a cero.'; $('#fAmt').focus(); return; }
  const date = $('#fDate').value || todayStr();
  const old = form.editingId ? txs.find(t=>t.id===form.editingId) : null;
  const tx = {
    kind:'tx', id: form.editingId || newId(), type: form.type, amount,
    cat: form.cat, desc: $('#fDesc').value.trim().slice(0,80), date,
    method: $('#fMethod').value, created: old? (old.created||Date.now()) : Date.now()
  };
  lsSet('gastos_lastMethod', tx.method);
  const btn=$('#fSave'); btn.disabled=true;
  try{
    await saveTx(tx);
    closeSheet();
    toast(form.editingId?'Cambios guardados':(tx.type==='ingreso'?'Ingreso registrado':'Gasto registrado'));
    const [y,m]=date.split('-').map(Number);
    if(y!==cur.y || m-1!==cur.m){ cur={y,m:m-1}; render(); }
  }catch(e){
    $('#fErr').textContent = e && e.code==='quota_exceeded' ? 'Se alcanzó el límite de almacenamiento.' : 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';
  }finally{ btn.disabled=false; }
});
$('#fDel').addEventListener('click',()=>$('#confirmDel').classList.add('show'));
$('#noDel').addEventListener('click',()=>$('#confirmDel').classList.remove('show'));
$('#yesDel').addEventListener('click', async ()=>{
  try{ await deleteTx(form.editingId); closeSheet(); toast('Movimiento eliminado'); }
  catch(e){ $('#fErr').textContent='No se pudo eliminar. Inténtalo de nuevo.'; }
});
$('#overlay').addEventListener('click', closeSheet);
$('#fab').addEventListener('click',()=>openSheet(null));
$('#list').addEventListener('click',e=>{ const it=e.target.closest('.item'); if(!it) return; const t=txs.find(x=>x.id===it.dataset.id); if(t) openSheet(t); });

/* ---------- Navegación ---------- */
function setView(v){
  view=v;
  ['home','stats','settings'].forEach(k=>$('#v-'+k).classList.toggle('hidden', k!==v));
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  render(); window.scrollTo({top:0});
}
document.querySelectorAll('.nb').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));
$('#summary').addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) setView(b.dataset.go); });
$('#prevM').addEventListener('click',()=>{ cur=shift(cur.y,cur.m,-1); render(); });
$('#nextM').addEventListener('click',()=>{ cur=shift(cur.y,cur.m,1); render(); });
$('#q').addEventListener('input',()=>renderList(inMonth(cur.y,cur.m)));
$('#saveBudget').addEventListener('click', async ()=>{
  try{ await saveSettings({budget:Number(digits($('#budgetIn').value))||0}); $('#budgetIn').blur(); toast('Presupuesto guardado'); }
  catch(e){ toast('No se pudo guardar'); }
});
$('#copyCsv').addEventListener('click', async ()=>{
  const ta=$('#csv');
  try{ await navigator.clipboard.writeText(ta.value); toast('CSV copiado'); }
  catch(e){ ta.focus(); ta.select(); toast('Selecciona y copia el texto'); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

/* ---------- Inicio ---------- */
setSync();
render();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
goLocal();
})();
</script>
</body>
</html>
